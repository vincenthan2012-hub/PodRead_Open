services:
  # Unified service (Frontend + Backend)
  - type: web
    name: podread
    env: node
    buildCommand: npm install && npm run build && cd server && npm install
    startCommand: node server/index-unified.js
    envVars:
      # 必需的环境变量
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      # 可选的 AI 配置
      - key: VITE_AI_PROVIDER
        sync: false
        required: false
      - key: VITE_AI_API_URL
        sync: false
        required: false
      - key: VITE_AI_MODEL_NAME
        sync: false
        required: false
      - key: VITE_AI_API_KEY
        sync: false
        required: false
      - key: GEMINI_API_KEY
        sync: false
        required: false
      # 可选的 SMTP 配置（用于设置面板默认值）
      - key: VITE_SMTP_HOST
        sync: false
        required: false
      - key: VITE_SMTP_PORT
        sync: false
        required: false
      - key: VITE_SMTP_USER
        sync: false
        required: false
      # 后端 SMTP 配置（实际用于发送邮件）
      - key: SMTP_HOST
        sync: false
        required: false
      - key: SMTP_PORT
        sync: false
        required: false
      - key: SMTP_USER
        sync: false
        required: false
      - key: SMTP_PASS
        sync: false
        required: false
      # 注意：VITE_EMAIL_API_URL 不再需要，因为前后端在同一个服务

